# Synology Container Manager → 프로젝트 → 생성 에서 이 파일을 그대로 사용합니다. (NAS 폴더: /docker/alphy)
# 이미지는 GitHub Actions 가 main 머지 때마다 만들어 GHCR 에 올리고,
# 아래 watchtower 가 장 시간이 아닐 때 10분마다 확인해서 새 이미지면 앱 컨테이너를 자동으로 교체합니다.
# NAS 에서 직접 빌드하려면: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# 밖(인터넷)에서 접속: DSM 역방향 프록시(https://alphy.devsean.me → localhost:3000)로만 엽니다. docs/external-access.md
#   공유기에서 3000 번 포트는 절대 열지 마세요 (HTTPS 없이 비밀번호가 그대로 오갑니다).
services:
  alphy:
    image: ghcr.io/bw1213/alphy:latest
    container_name: alphy
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    # NAS 사용자 권한으로 실행 (SSH 에서 `id` 로 확인. DSM 첫 관리자 계정은 보통 1026:100)
    user: "${PUID:-1026}:${PGID:-100}"
    # 컨테이너가 뚫려도 권한을 더 얻지 못하게 (앱은 특별한 권한이 필요 없음)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - TZ=Asia/Seoul
      # 앱 설정은 모두 웹 화면(/settings)에서 하고 nas/cache/config/ 에 저장됩니다 (환경변수는 읽지 않음)
    volumes:
      - ./nas/cache:/app/.cache       # 화면 설정(config/)·로그인 기록·시세 캐시·KIS 접근토큰
      - ./nas/csv:/app/data/csv       # 내 CSV 데이터 ({종목코드}.csv, KOSPI.csv)
    networks: [default, sandbox]

  # 전략 실행기: 사용자가 쓴 전략 코드만 여기서 실행. 설정 폴더·비밀값·인터넷 없음 (sandbox 망은 밖으로 나가지 못함)
  # 이 컨테이너가 없으면 본체 안의 격리 공간에서 실행됩니다
  alphy-runner:
    image: ghcr.io/bw1213/alphy:latest
    container_name: alphy-runner
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    command: ["node", "--no-node-snapshot", "sandbox-runner.js"]
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/health"]
      interval: 60s
      timeout: 5s
    networks: [sandbox]

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: alphy-watchtower
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Asia/Seoul
      - WATCHTOWER_LABEL_ENABLE=true      # 위 라벨이 붙은 컨테이너만 갱신 (NAS 의 다른 컨테이너는 건드리지 않음)
      # 장 시간(08:00~15:59)에는 앱을 다시 켜지 않음: 아침 자동 주문·체결 확인이 끊기지 않게.
      # 그 밖의 시간에 10분마다 확인 (초 분 시 일 월 요일)
      - WATCHTOWER_SCHEDULE=0 */10 0-7,16-23 * * *
      - WATCHTOWER_CLEANUP=true           # 이전 이미지 삭제
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  sandbox:
    internal: true
